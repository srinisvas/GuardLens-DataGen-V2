# model_bench_configs.yaml
#
# v4 runtime policy:
#   - All benchmark phases set VLLM_USE_FLASHINFER_SAMPLER=0 so every model
#     uses vLLM's native sampler. This avoids FlashInfer JIT compilation and
#     removes the compute-node nvcc/CUDA_HOME dependency.
#   - All phases explicitly set VLLM_ALLREDUCE_USE_FLASHINFER=0.
#   - runtime_compat_v12.py applies the upstream Python <=3.11 postponed-
#     annotations fix needed by the pinned FlashInfer communicator import.
#   - Qwen3.5 uses --no-enable-prefix-caching explicitly because vLLM 0.28
#     defaults prefix caching ON.
#
# v3 changes retained:
#   - Cross-judge phase reloads BOTH judges (Qwen + Mistral) on 2 GPUs.
#   - K max_turns is 12 to match _BENCH_STRATEGIES.
#   - Qwen prefix caching is disabled due to the hybrid GDN/Mamba path.
#
# v2 corrections retained:
#   - Qwen post-trained ID is Qwen/Qwen3.5-27B (no -Instruct suffix).
#   - Llama-4-Scout is 17B activated but 109B total; deferred to a
#     separate quantized bench (config_b2_scout_quantized_optional).
#   - Both configs share Llama-3.3-70B and Qwen3.5-27B servers (role swap
#     across configs, not same-record circularity).
#
# Server layout on 4×A100-80GB (all BF16, all concurrent):
#
#   port 8001 (GPUs 0,1, TP=2): meta-llama/Llama-3.3-70B-Instruct
#                                 → config_a generator
#                                 → config_b target
#   port 8002 (GPU 2, TP=1):    Qwen/Qwen3.5-27B
#                                 → config_a judge
#                                 → config_b generator
#   port 8003 (GPU 3, TP=1):    google/gemma-4-31B-it
#                                 → config_a target only
#                                 → (must swap out for config_b)
#   port 8004 (GPU 3, TP=1):    mistralai/Mistral-Small-3.2-24B-Instruct-2506
#                                 → config_b judge only
#                                 → (must swap out for config_a)
#
# Since GPU 3 can only host one of {Gemma-4-31B, Mistral-Small-3.2-24B}
# at a time in BF16, the benchmark runs in three phases:
#   Phase 1: Llama-70B + Qwen3.5-27B + Gemma-4-31B → bench config_a
#   Phase 2: Llama-70B + Qwen3.5-27B + Mistral-Small-3.2 → bench config_b
#   Phase 3: BOTH judges alive (Qwen3.5-27B + Mistral-Small-3.2) on 2 GPUs,
#            re-judge each other's stored responses for cross-judge
#            agreement.
#
# Universal environment flags (set by all SLURM phases):
#   VLLM_USE_FLASHINFER_SAMPLER=0
#   VLLM_ALLREDUCE_USE_FLASHINFER=0
#
# vLLM launch flags per server (start at 8K, raise only if K needs more):
#   --host 127.0.0.1   (no meaningful auth; keep local)
#   --dtype bfloat16
#   --max-model-len 8192
#   --gpu-memory-utilization 0.95
#
# Prefix caching:
#   - Llama-3.3-70B, Gemma-4-31B, Mistral-Small-3.2: --enable-prefix-caching
#   - Qwen3.5-27B: --no-enable-prefix-caching
#     Qwen3.5 is hybrid GDN/Mamba; prefix caching uses the experimental
#     mamba_cache_mode=align path. For this scientific benchmark,
#     reproducibility/predictability beats the small throughput gain.
#
# Qwen-specific flags (all Qwen3.5 launches):
#   --no-enable-prefix-caching
#   --reasoning-parser qwen3
#   --language-model-only
#   --default-chat-template-kwargs '{"enable_thinking": false}'
#
# Mistral-specific flags (all Mistral-Small-3.2 launches):
#   --language-model-only
#   --tokenizer_mode mistral
#   --config_format mistral
#   --load_format mistral
#
# Only raise --max-model-len (8K → 12K → 16K) after inspecting observed
# prompt-token maxima from the bench report's "Context size observed"
# section. Strategy K has max_turns=12 and may push toward 8K on the
# late judge turns; other strategies should stay well below.

configurations:

  - name: config_a
    # 70% of full generation
    generator:
      family: meta
      model: meta-llama/Llama-3.3-70B-Instruct
      base_url: http://127.0.0.1:8001
      notes: "TP=2 across GPUs 0,1; ~140GB BF16"
    target:
      family: google
      model: google/gemma-4-31B-it
      base_url: http://127.0.0.1:8003
      notes: "TP=1 GPU 3; ~62GB BF16; contemporary aligned target"
    judge:
      family: alibaba
      model: Qwen/Qwen3.5-27B
      base_url: http://127.0.0.1:8002
      notes: "TP=1 GPU 2; ~54GB BF16; post-trained ID has no -Instruct suffix; thinking mode OFF; prefix cache OFF"

  - name: config_b
    # 30% of full generation
    generator:
      family: alibaba
      model: Qwen/Qwen3.5-27B
      base_url: http://127.0.0.1:8002
      notes: "Same physical server as config_a judge — role swap across configs; thinking mode OFF; prefix cache OFF"
    target:
      family: meta
      model: meta-llama/Llama-3.3-70B-Instruct
      base_url: http://127.0.0.1:8001
      notes: "Same physical server as config_a generator — role swap"
    judge:
      family: mistral
      model: mistralai/Mistral-Small-3.2-24B-Instruct-2506
      base_url: http://127.0.0.1:8004
      notes: "TP=1 GPU 3; ~55GB BF16; replaces Gemma between phases; native mistral tokenizer/config/load"

