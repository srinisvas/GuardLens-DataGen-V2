# GuardLens DataGen V2 — conda environment
#
# Target system:
#   NVIDIA A100 80GB PCIe (Ampere, sm_80)
#   Driver R580 LTS (580.105.08+), CUDA runtime 13.0
#   Linux x86_64
#
# Create:
#   conda env create -f environment.yml
#   conda activate dataset_gen
#
# Verify (login node, no GPU needed):
#   python -c "import vllm; print('vllm', vllm.__version__)"
#   python -c "from datasketch import MinHashLSH; print('datasketch OK')"
#
# Verify GPU stack (compute node):
#   srun --partition=defq --gres=gpu:1 --time=00:05:00 --pty bash -c \
#     'python -c "import torch; print(torch.cuda.is_available(), \
#       torch.cuda.get_device_name(0), torch.version.cuda)"'
#   # Expected: True, "NVIDIA A100 80GB PCIe", "13.0"
#
# Design note: pip requirements live in requirements.txt (single source of
# truth). This YAML is a thin conda wrapper so `conda env create -f` still
# works if you prefer conda. Any dep change goes in requirements.txt only.

name: dataset_gen
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24.0
  - pip:
      - -r requirements.txt